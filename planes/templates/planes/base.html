<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymManager — {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
       /* 1. Estructura general */
       body { background-color: #f4f6f9; }
       .container { max-width: 1200px; }

       /* 2. Componentes */
       .navbar-brand { font-weight: bold; }
       .card { box-shadow: 0 2px 8px rgba(0,0,0,.08); }

       /* 3. Tablas */
       .table th, .table td { vertical-align: middle; }
       .table td strong { white-space: nowrap; }

       /* 4. Footer */
       footer { margin-top: 40px; padding: 20px; text-align: center; color: #888; font-size: .9rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'planes:inicio' %}">🏋️ GymManager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'planes:inicio' %}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'planes:lista' %}">Planes</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'planes:crear' %}">+ Nuevo Plan</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/" target="_blank">Admin</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-success alert-dismissible fade show">
                {{ m }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<footer>
    GymManager — Proyecto Django + MySQL · Programación Backend
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
